<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>个人小站导航页面</title>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
  <style>
    :root {
      --main-bg: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
      --card-bg: rgba(255, 255, 255, 0.25);
      --card-blur: blur(10px);
      --card-border: rgba(255,255,255,0.4);
      --hover-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
      --font-main: 'ZCOOL XiaoWei', 'Microsoft YaHei', sans-serif;
      --primary: #7f53ac;
      --secondary: #647dee;
      --radius: 18px;
      --transition: all 0.28s cubic-bezier(.4,2,.6,1);
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--main-bg);
      font-family: var(--font-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 900px;
      padding: 40px 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: #fff;
      font-size: 2.8rem;
      letter-spacing: 2px;
      margin-bottom: 16px;
      text-shadow: 0 2px 8px rgba(80,80,80,0.15);
    }
    .subtitle {
      color: #f6f6f6;
      font-size: 1.2rem;
      margin-bottom: 32px;
      letter-spacing: 1px;
      opacity: 0.85;
    }
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 28px;
      width: 100%;
    }
    .nav-card {
      background: var(--card-bg);
      backdrop-filter: var(--card-blur);
      border-radius: var(--radius);
      border: 1.5px solid var(--card-border);
      box-shadow: var(--hover-shadow);
      padding: 32px 22px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .nav-card::before {
      content: "";
      position: absolute;
      top: -30px; left: -30px;
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #fbc2eb 0%, #a18cd1 100%);
      opacity: 0.12;
      border-radius: 50%;
      z-index: 0;
    }
    .nav-card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 12px 38px 0 rgba(127, 83, 172, 0.18);
      border-color: #fff;
      background: rgba(255,255,255,0.43);
    }
    .nav-title {
      font-size: 1.3rem;
      color: var(--primary);
      font-weight: bold;
      margin-bottom: 8px;
      letter-spacing: 1px;
      z-index: 1;
    }
    .nav-desc {
      color: #555;
      font-size: 1.05rem;
      margin-bottom: 0;
      z-index: 1;
      opacity: 0.8;
    }
    .nav-link {
      text-decoration: none;
      width: 100%;
      display: block;
      height: 100%;
    }
    @media (max-width: 600px) {
      .container {
        padding: 24px 4px;
      }
      h1 {
        font-size: 2rem;
      }
      .nav-card {
        padding: 22px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>九流导航</h1>
    <div class="subtitle">精选实用·美观自适应·一站直达</div>
    <div class="nav-grid">
      <a class="nav-link" href="https://www.jiuliusq.net" target="_blank" rel="noopener">
        <div class="nav-card">
          <div class="nav-title">月影诗坊</div>
          <div class="nav-desc">诗意人生，文学交流的温馨角落</div>
        </div>
      </a>
      <a class="nav-link" href="https://jiuliusq.net" target="_blank" rel="noopener">
        <div class="nav-card">
          <div class="nav-title">高分上岸论坛</div>
          <div class="nav-desc">考研考公交流，助你高分上岸</div>
        </div>
      </a>
      <a class="nav-link" href="https://hotel.jiuliusq.net" target="_blank" rel="noopener">
        <div class="nav-card">
          <div class="nav-title">免费音乐</div>
          <div class="nav-desc">畅听无广告，发现好音乐</div>
        </div>
      </a>
      <a class="nav-link" href="https://demo.jiuliusq.net" target="_blank" rel="noopener">
        <div class="nav-card">
          <div class="nav-title">VIP免费视频播放</div>
          <div class="nav-desc">高清流畅，免费体验VIP影视</div>
        </div>
      </a>
      <a class="nav-link" href="https://danci.jiuliusq.net" target="_blank" rel="noopener">
        <div class="nav-card">
          <div class="nav-title">高效背单词</div>
          <div class="nav-desc">智能记忆，轻松提升词汇量</div>
        </div>
      </a>
      <a class="nav-link" href="https://nce.jiuliusq.net" target="_blank" rel="noopener">
        <div class="nav-card">
          <div class="nav-title">新概念英语学习</div>
          <div class="nav-desc">全套课程，助你英语进阶</div>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
